[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-chronicle"
version = "0.1.0"
description = "Production tooling for The Compliance Chronicle — the monthly citation-verified regulatory-change briefing for Texas cottage-food operators."
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["compliance_chronicle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
